<!DOCTYPE html>
<html lang="es" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tema antes de pintar: lee el tema guardado (el mismo que usa
         ThemeProvider) y pone la clase en <html> de una vez. Sin esto, con tema
         oscuro guardado la pagina se dibujaba clara y luego cambiaba. -->
    <script>
      (function () {
        try {
          var tema = localStorage.getItem("vending-theme");
          if (tema === "system") {
            tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (tema !== "dark") tema = "light";
          var raiz = document.documentElement;
          raiz.classList.remove("light", "dark");
          raiz.classList.add(tema);
        } catch (e) {
          // Almacenamiento bloqueado: se queda el tema claro por defecto.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <meta name="author" content="Todo Vending CA" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="geo.region" content="VE-B" />
    <meta name="geo.placename" content="Lechería, Anzoátegui, Venezuela" />
    <meta name="geo.position" content="10.1784238;-64.691242" />
    <meta name="ICBM" content="10.1784238, -64.691242" />
    <meta name="language" content="es" />
    <meta name="theme-color" content="#F26A21" />
    <meta name="contact" content="todovendingca@gmail.com" />
    <meta name="reply-to" content="todovendingca@gmail.com" />
    <meta name="rating" content="general" />
    <meta name="distribution" content="global" />
    <meta name="category" content="Máquinas Expendedoras, Vending, Snacks, Bebidas, Café" />

    <!--app-head-->

    <!-- Fuentes del diseño Vitrina. No bloquean el render: se precargan como
         estilo y se activan al llegar; sin JS las carga el <noscript>.
         Bricolage Grotesque (títulos), Instrument Sans (texto), IBM Plex Mono
         (etiquetas y códigos), Doto (pantallas LED). Fraunces va aparte: solo
         la usa el avance de Café Oriente y el navegador la baja si hace falta. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Doto:wght@900&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Sans:wght@400..700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Doto:wght@900&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Sans:wght@400..700&display=swap">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
