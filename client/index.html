<!DOCTYPE html>
<html lang="es" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <meta name="author" content="Todo Vending CA" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="geo.region" content="VE-B" />
    <meta name="geo.placename" content="Lechería, Anzoátegui, Venezuela" />
    <meta name="geo.position" content="10.1784238;-64.691242" />
    <meta name="ICBM" content="10.1784238, -64.691242" />
    <meta name="theme-color" content="#182038" />
    <meta name="color-scheme" content="light dark" />

    <!--app-head-->

    <!-- Fuentes propias: solo se precarga la del titular (LCP) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-latin-wght-v1.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/figtree-latin-wght-v1.woff2" crossorigin />

    <!-- Tema: se aplica antes de pintar para evitar el parpadeo claro/oscuro -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("vending-theme");
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
